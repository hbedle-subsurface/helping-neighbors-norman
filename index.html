<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helping Neighbors Norman</title>
<meta name="description" content="Vecinos que Ayudan - Ayuda en Norman, Oklahoma: comida, vivienda, salud y más. Toque una imagen y escuche la información en español. Help in Norman, Oklahoma, with audio in Spanish.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D2150;
  --ink-soft:#4B4F7D;
  --indigo:#2B2F77;
  --indigo-dk:#1D2150;
  --violet:#6A47E0;
  --lilac:#ECE6FA;
  --paper:#F7F4FB;
  --card:#FFFFFF;
  --line:#DDD6EE;
  --wa:#16863F;
  --focus:#FFB300;
  --shadow:0 1px 2px rgba(29,33,80,.08), 0 8px 22px rgba(29,33,80,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:19px;line-height:1.45;
}
button,input{font:inherit;color:inherit}
a{color:var(--indigo)}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
svg{display:block}

/* ---------- header ---------- */
header.top{background:var(--indigo);color:#fff}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;margin-right:auto;min-width:0}
.brand .mark{width:52px;height:52px;flex:none}
.brand b{display:block;font-size:26px;line-height:1.05;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:15px;opacity:.9;line-height:1.2}
.ctl{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:9px 16px;min-height:44px;border-radius:999px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--indigo)}
.voice-toggle{display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.55);background:transparent;color:#fff;
  min-height:48px;padding:6px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.voice-toggle[aria-pressed="true"]{background:#fff;color:var(--indigo);border-color:#fff}
.voice-toggle svg{width:26px;height:26px}

main{max-width:980px;margin:0 auto;padding:18px 16px 30px}

/* ---------- home ---------- */
.ask{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.ask h1{font-size:27px;line-height:1.15;margin:0;font-weight:700}
.ask p{margin:2px 0 0;color:var(--ink-soft);font-size:18px}
.bigspeak{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--violet);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 #4A2DB0}
.bigspeak svg{width:36px;height:36px}
.bigspeak:active{transform:translateY(2px);box-shadow:0 2px 0 #4A2DB0}
.bigspeak.on{background:#4A2DB0}

.find{display:flex;gap:8px;margin:0 0 18px}
.find .field{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:0 6px 0 14px;min-height:56px}
.find .field:focus-within{border-color:var(--indigo)}
.find input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:19px;padding:12px 4px}
.find .field svg{width:24px;height:24px;color:var(--ink-soft);flex:none}
.iconbtn{border:0;background:var(--lilac);color:var(--indigo);width:46px;height:46px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:26px;height:26px;color:inherit}
.iconbtn.rec{background:#B3261E;color:#fff}
.find .go{flex:none;background:var(--indigo);color:#fff;border:0;border-radius:16px;padding:0 16px;font-weight:700;min-height:56px;cursor:pointer}

.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:860px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{width:100%;height:100%;min-height:158px;border:0;border-radius:24px;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 10px;text-align:center;
  box-shadow:0 5px 0 rgba(0,0,0,.22);font-weight:700;font-size:21px;line-height:1.15;text-decoration:none}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile svg{width:76px;height:76px}
.tile .n{font-size:15px;font-weight:400;opacity:.92}

.sos{margin-top:26px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:16px}
.sos h2{margin:0 0 10px;font-size:22px}
.sos-row{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.sos-row{grid-template-columns:repeat(3,1fr)}}
.sosbtn{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:var(--indigo);border-radius:16px;padding:12px 14px;min-height:68px}
.sosbtn.red{background:#A61B1B}
.sosbtn svg{width:30px;height:30px;flex:none}
.sosbtn b{display:block;font-size:26px;line-height:1}
.sosbtn span{font-size:16px;line-height:1.2;display:block}

.sharebar{margin-top:18px;display:flex;justify-content:center}

/* ---------- crisis tile + detained page ---------- */
.tiles li.wide{grid-column:1/-1}
.tile.sos-tile{flex-direction:row;justify-content:flex-start;text-align:left;gap:16px;min-height:118px;padding:14px 18px;font-size:25px;border:4px solid #fff;outline:4px solid #A61B1B}
.tile.sos-tile svg{width:78px;height:78px;flex:none}
.tile.sos-tile small{display:block;font-size:17px;font-weight:400;opacity:.95;margin-top:4px;line-height:1.25}
.notice{background:#fff;border-left:10px solid #A61B1B;border-radius:14px;padding:12px 16px;margin:6px 0 14px;font-size:18px;box-shadow:var(--shadow)}
.jump{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 6px}
@media (min-width:700px){.jump{grid-template-columns:repeat(3,1fr)}}
.jump button{display:flex;align-items:center;gap:10px;min-height:60px;border:2px solid var(--indigo);background:#fff;color:var(--indigo);border-radius:14px;padding:6px 10px;font-weight:700;font-size:18px;text-align:left;cursor:pointer}
.jump .jic{flex:none;width:36px;height:36px;border-radius:10px;background:#A61B1B;display:grid;place-items:center;color:#fff}
.jump .jic svg{width:26px;height:26px}
.dsec{margin-top:26px;scroll-margin-top:12px}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.dhead .dico{flex:none;width:56px;height:56px;border-radius:16px;background:#A61B1B;display:grid;place-items:center;color:#fff}
.dhead .dico svg{width:38px;height:38px}
.dhead h2{margin:0;font-size:26px;line-height:1.15;flex:1 1 220px}
.dhead .act{flex:0 0 auto;min-width:150px}
.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;margin:0 0 10px;font-size:21px;line-height:1.4}
.steps li::before{content:counter(s);flex:none;width:38px;height:38px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.linklist{display:grid;gap:10px;margin-top:8px}
.linklist .act{justify-content:flex-start;text-align:left;min-height:64px}
.linklist .act small{display:block;font-weight:400;font-size:15px;color:var(--ink-soft)}
.srcnote{margin:18px 0 0;color:var(--ink-soft);font-size:16px}

/* ---------- list pages ---------- */
.back{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--indigo);color:#fff;border-radius:16px;padding:10px 20px 10px 14px;font-weight:700;font-size:21px;min-height:56px;cursor:pointer;text-decoration:none}
.back svg{width:30px;height:30px}
.cathead{display:flex;align-items:center;gap:16px;margin:16px 0 8px}
.cathead .ico{flex:none;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff}
.cathead .ico svg{width:64px;height:64px}
.cathead h1{margin:0;font-size:31px;line-height:1.1}
.cathead p{margin:4px 0 0;color:var(--ink-soft);font-size:18px}
.cathead .bigspeak{margin-left:auto}
.count{color:var(--ink-soft);margin:4px 0 14px}
h2.group{font-size:20px;margin:26px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--line);color:var(--indigo)}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 16px 14px;margin:0 0 14px;border-left:10px solid var(--c,#999)}
.card h3{margin:0 0 6px;font-size:23px;line-height:1.2}
.card .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;background:var(--c,#555);border-radius:999px;padding:3px 10px 3px 6px}
.chip svg{width:18px;height:18px}
.row{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:19px}
.row svg{width:22px;height:22px;flex:none;margin-top:3px;color:var(--ink-soft)}
.row .t{min-width:0;overflow-wrap:anywhere}
.row .lbl{font-weight:700}
.phone{font-weight:700;font-size:21px;letter-spacing:.3px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .act{flex:1 1 150px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;border:2px solid var(--indigo);background:#fff;color:var(--indigo);
  font-weight:700;font-size:18px;text-decoration:none;cursor:pointer;padding:6px 8px}
.act svg{width:28px;height:28px;flex:none}
.act.listen{background:var(--violet);border-color:var(--violet);color:#fff}
.act.listen.on{background:#4A2DB0;border-color:#4A2DB0}
.act.call{background:var(--indigo);color:#fff}
.act.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.act:active{transform:translateY(1px)}
.empty{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow)}

footer{background:#fff;border-top:1px solid var(--line);margin-top:20px}
.foot-in{max-width:980px;margin:0 auto;padding:22px 16px 34px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.foot-in img{width:230px;max-width:60%;height:auto}
.foot-in p{margin:0 0 6px;font-size:16px;color:var(--ink-soft)}
.foot-in .proj{font-weight:700;color:var(--ink);font-size:17px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:17px;max-width:90%;display:none;z-index:9}
.toast.show{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top .ctl,.acts,.find,.sos,.back,.bigspeak{display:none}.card{box-shadow:none;border:1px solid #999;break-inside:avoid}}
</style>
</head>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" id="brandlink" aria-label="Helping Neighbors Norman">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#fff"/><g fill="#2B2F77"><rect x="19" y="33" width="28" height="22" rx="10"/><rect x="19" y="14" width="6" height="28" rx="3"/><rect x="26" y="9" width="6" height="33" rx="3"/><rect x="33" y="11" width="6" height="31" rx="3"/><rect x="40" y="16" width="6" height="26" rx="3"/><rect x="9" y="30" width="6" height="20" rx="3" transform="rotate(-28 12 40)"/></g></svg>
      <span><b id="brandName">Helping Neighbors</b><small id="sub">Norman, Oklahoma</small></span>

    <div class="ctl">

        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <button type="button" class="voice-toggle" id="voiceToggle" aria-pressed="true"></button>
    </div>

</header>

<main id="app" tabindex="-1"></main>

<footer>

    </div>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voices = [];
function loadVoices(){ if(canSpeak) voices = speechSynthesis.getVoices() || []; }
if (canSpeak){ loadVoices(); speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", loadVoices); }
const FEMALE = /paulina|m[oó]nica|sabina|helena|dalia|paloma|marisol|angelica|ang[eé]lica|elena|luc[ií]a|laura|camila|elvira|salom[eé]|sof[ií]a|google espa|samantha|zira|aria|jenny|karen|moira|tessa|female|mujer/i;
const MALE = /jorge|diego|juan|pablo|ra[uú]l|carlos|enrique|miguel|alberto|andr[eé]s|alvaro|male|hombre|david|mark|daniel|alex|fred|tom\b/i;
function pickVoice(){
  const base = LANG === "es" ? "es" : "en";
  const list = voices.filter(v => v.lang && v.lang.toLowerCase().replace("_","-").startsWith(base));
  const rank = v => { const l=v.lang.toLowerCase().replace("_","-");
    const region = LANG==="es" ? (l==="es-us"?0:l==="es-mx"?0.5:2) : (l==="en-us"?0:1);
    const who = FEMALE.test(v.name) ? -2 : (MALE.test(v.name) ? 2 : 0);
    return region + who + (v.localService?0:0.5); };
  list.sort((a,b)=>rank(a)-rank(b));
  return list[0] || null;
}
let speakingBtn = null;
function setSpeakingUI(btn){
  document.querySelectorAll(".speaking").forEach(b => { b.classList.remove("speaking","on"); b.dataset.state=""; refreshListenLabel(b); });
  speakingBtn = btn || null;
  if (btn){ btn.classList.add("speaking","on"); btn.dataset.state="on"; refreshListenLabel(btn); }
}
function refreshListenLabel(b){
  const lab = b.querySelector(".lt");
  const on = b.classList.contains("speaking");
  if (lab) lab.textContent = on ? t().stop : t().listen;
  b.setAttribute("aria-label", (on ? t().stop : t().listen));
}
function stopSpeech(){ if(canSpeak) speechSynthesis.cancel(); setSpeakingUI(null); }
function speak(text, btn){
  if (!canSpeak || !text) return;
  if (btn && btn === speakingBtn){ stopSpeech(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) u.voice = v;
  u.lang = v ? v.lang : t().speechLang;
  u.rate = 0.9;
  u.onend = u.onerror = () => { if (speakingBtn === btn) setSpeakingUI(null); };
  setSpeakingUI(btn || null);
  speechSynthesis.speak(u);
}
function spokenPhone(p){
  const d = String(p).replace(/\D/g,"").replace(/^1(?=\d{10}$)/,"");
  if (d.length === 10) return [d.slice(0,3),d.slice(3,6),d.slice(6)].map(x=>x.split("").join(" ")).join(", ");
  return d.split("").join(" ");
}
function spokenText(s){
  const dirs = LANG==="es" ? {N:"Norte",S:"Sur",E:"Este",W:"Oeste"} : {N:"North",S:"South",E:"East",W:"West"};
  return String(s)
    .replace(/\b([NSEW])\.\s/g, (m,c)=>dirs[c]+" ")
    .replace(/\s*[–—]\s*/g, LANG==="es" ? " a " : " to ")
    .replace(/\b(\d{3})-(\d{3})-(\d{4})\b/g, (m,a,b,c)=>spokenPhone(a+b+c))
    .replace(/https?:\/\/\S+/g,"")
    .replace(/&/g, LANG==="es" ? " y " : " and ");
}
function cardSpeech(it){
  const parts = [itemName(it)];
  const a = itemAddr(it);
  if (a) parts.push(t().addr + ": " + spokenText(a));
  const d = itemDet(it);
  if (d) parts.push(spokenText(d));
  if (it.p) parts.push(t().tel + ": " + spokenPhone(it.p));
  if (it.p2) parts.push((it.p2[LANG]||it.p2.en) + ": " + spokenPhone(it.p2.num));
  return parts.join(". ");
}

function setupMic(){

    mic.classList.add("rec"); mic.setAttribute("aria-label", t().micStop);

const STOP = new Set(["necesito","quiero","busco","tengo","ayuda","donde","para","with","need","want","help","where","looking","for","the","and","como","que","por","con","una","uno","los","las","mis","can","get","find","dame","cerca","near","free","gratis"]);
function searchItems(q){
  const tokens = norm(q).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => w.replace(/(es|s)$/,""));
  if (!tokens.length) return [];
  const catHay = {}; CATS.forEach(c => { catHay[c.id] = norm(c.es.kw + " " + c.en.kw + " " + c.es.label + " " + c.en.label); });
  const direct = [], viaCat = [];
  ITEMS.forEach(it => {
    const hay = norm([it.n, it.ns, it.a, it.as, it.d && it.d.en, it.d && it.d.es, it.g && it.g.en].join(" "));
    let d = 0, c = 0;
    tokens.forEach(tk => { if (hay.includes(tk)) d++; else if (it.cats.some(id => (catHay[id]||"").includes(tk))) c++; });
    if (d) direct.push({it, s: d * 4 + c});
    else if (c) viaCat.push({it, s: c});
  });
  direct.sort((x,y) => y.s - x.s);
  const out = direct.map(x => x.it);
  if (out.length < 8) out.push(...viaCat.map(x => x.it).slice(0, 12 - out.length));
  return out.slice(0, 30);
}

function searchView(q){
  stopSpeech();

  app.innerHTML = `${backHtml()}

  document.title = q + " - " + t().brand + " Norman";
  wireCards(app);
  window.scrollTo(0,0);
}

}
function stepsSection(sec){
  const steps = sec.steps[LANG];
  return `<section class="dsec" id="sec-${sec.id}">${secHead(sec.id, sec.title[LANG], sec.id)}<ol class="steps">${steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></section>`;
}
function detainedSpeech(key){
  const sec = DET.sections.find(x => x.id === key);
  if (!sec) return "";
  return sec.title[LANG] + ". " + sec.steps[LANG].map((x,i) => (i+1) + ". " + spokenText(x)).join(" ");
}
function detainedView(){
  stopSpeech();
  const lawyers = DET.lawyers.map(n => ITEMS.find(i => i.n === n)).filter(Boolean);
  const cons = ITEMS.filter(i => i.cats.includes("detained"));
  const sec = id => DET.sections.find(x => x.id === id);
  const jumps = [["lawyer",t().jLawyer,"lawyer"],["find",t().jFind,"find"],["door",t().jDoor,"door"],["street",t().jStreet,"street"],["cons",t().jCons,"cons"],["plan",t().jPlan,"plan"]];
  app.innerHTML = `${backHtml()}
    <div class="cathead">
      <div class="ico" style="background:${DET_COLOR}">${catIcon("detained")}</div>
      <div><h1>${esc(t().detainedTile)}</h1><p>${esc(DET.sub[LANG])}</p></div>
    </div>
    <div class="notice">${esc(DET.notice[LANG])}</div>
    <nav class="jump" aria-label="${esc(t().detainedTile)}">${jumps.map(j => `<button type="button" data-jump="${j[2]}"><span class="jic">${DI[j[2]]}</span><span>${esc(j[1])}</span></button>`).join("")}</nav>
    <section class="dsec" id="sec-lawyer">${secHead("lawyer", t().secLawyers, "")}${lawyers.map(it => cardHtml(it,false)).join("")}</section>
    ${stepsSection(sec("find"))}
    ${stepsSection(sec("door"))}
    ${stepsSection(sec("street"))}
    <section class="dsec" id="sec-cons">${secHead("cons", t().secCons, "")}${cons.map(it => cardHtml(it,false)).join("")}</section>
    ${stepsSection(sec("plan"))}
    <section class="dsec" id="sec-links">${secHead("links", t().secLinks, "")}
      <div class="linklist">${DET.links.map(l => `<a class="act" href="${esc(l.url)}" target="_blank" rel="noopener">${ui("link")}<span>${esc(l.label[LANG])}<small>${esc(l.src)}</small></span></a>`).join("")}</div>
      <p class="srcnote">${esc(DET.source[LANG])}</p>
      <div class="sharebar"><button type="button" class="act wa" id="shareDet" style="padding:6px 22px">${ui("wa")}<span>${esc(t().shareSection)}</span></button></div>
    </section>`;
  document.title = t().detainedTile + " - " + t().brand + " Norman";
  $("#backBtn").addEventListener("click", () => { if (VOICE) speak(t().back, null); });
  app.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => {
    const el = $("#sec-" + b.dataset.jump); if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }));
  app.querySelectorAll('[data-act="dlisten"]').forEach(b => b.addEventListener("click", () => speak(detainedSpeech(b.dataset.key), b)));
  $("#shareDet").addEventListener("click", () => waShare(t().detainedTile + "\n" + siteLink("#/detained")));
  wireCards(app);
  app.focus({preventScroll:true}); window.scrollTo(0,0);
}

function listingView(sl){
  stopSpeech();
  const it = ITEMS.find(i => slug(i) === sl);
  if (!it){ location.hash = "#/"; return; }
  app.innerHTML = `${backHtml()}<div style="height:14px"></div>${cardHtml(it,true)}
    <p style="margin-top:18px"><a class="back" href="#/" style="background:var(--violet)"><span>${esc(t().moreHelp)}</span></a></p>`;
  document.title = itemName(it) + " - " + t().brand + " Norman";
  $("#backBtn").addEventListener("click", () => { if (VOICE) speak(t().back, null); });
  wireCards(app);
  window.scrollTo(0,0);
}

/* ===================== chrome ===================== */
function paintChrome(){
  document.documentElement.lang = LANG;
  $("#sub").textContent = t().sub;
  $("#brandName").textContent = t().brand;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  const vt = $("#voiceToggle");
  vt.setAttribute("aria-pressed", String(VOICE));
  vt.innerHTML = ui(VOICE ? "speaker" : "speakerOff") + `<span>${esc(VOICE ? t().voiceOn : t().voiceOff)}</span>`;
  vt.hidden = !canSpeak;
  $("#projLine").textContent = t().proj;
  $("#footNote1").textContent = t().foot1;
  $("#footNote2").textContent = t().foot2;
  $("#thanks").textContent = t().thanks;
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  LANG = b.dataset.lang; store.set("lang", LANG); paintChrome(); route();
}));
$("#voiceToggle").addEventListener("click", () => {
  VOICE = !VOICE; store.set("voice", VOICE ? "on" : "off"); paintChrome();
  if (VOICE) speak(LANG==="es" ? "Voz encendida" : "Voice on", null);
  else stopSpeech();
});

function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const [kind, ...rest] = h.split("/");
  const arg = decodeURIComponent(rest.join("/"));
  if (kind === "detained") detainedView();
  else if (kind === "l") listingView(arg);
  else if (kind === "c" && arg === "detained") detainedView();
  else if (kind === "c") categoryView(arg);
  else if (kind === "s" && arg) searchView(arg);
  else { homeView(); window.scrollTo(0,0); }
}
window.addEventListener("hashchange", route);
paintChrome();
route();
})();
</script>
</body>
</html>
